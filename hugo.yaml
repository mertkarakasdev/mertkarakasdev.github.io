baseURL: "https://mertkarakasdev.github.io/"
title: "Tuğrul Mert Karakaş"
theme: "PaperMod"

locale: "tr"
defaultContentLanguage: "tr"
hasCJKLanguage: false

enableRobotsTXT: true
enableEmoji: true
buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 10

minify:
  disableXML: true

# PaperMod'un arama sayfası için JSON indeksi gerekir
outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: monokai

menu:
  main:
    - identifier: hakkimda
      name: "Hakkımda"
      url: /hakkimda/
      weight: 5
    - identifier: arsiv
      name: "Arşiv"
      url: /arsiv/
      weight: 10
    - identifier: etiketler
      name: "Etiketler"
      url: /tags/
      weight: 20
    - identifier: ara
      name: "Ara"
      url: /ara/
      weight: 30

params:
