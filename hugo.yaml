  env: production          # Google Analytics / SEO etiketleri için
  author: "Tuğrul Mert Karakaş"
  description: "Tuğrul Mert Karakaş — full stack web geliştirici ve grafik tasarımcı. Yazılım ve tasarım üzerine notlar."
  keywords: ["blog", "yazılım", "notlar"]
  DateFormat: "2 January 2006"

  defaultTheme: auto       # auto | light | dark
  disableThemeToggle: false

  ShowReadingTime: true
  ShowWordCount: false
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowToc: true
  TocOpen: false
  hidemeta: false
  hideSummary: false
  comments: false

  # Ana sayfadaki karşılama bloğu
  homeInfoParams:
    Title: "Merhaba 👋"
    Content: >
      Full stack web geliştirici ve grafik tasarımcıyım. Burada öğrendiklerimi,
      üzerinde çalıştığım projeleri ve not almaya değer bulduğum şeyleri yazıyorum.

  socialIcons:
    - name: github
      title: "GitHub"
      url: "https://github.com/mertkarakasdev"
    - name: x
      title: "X"
      url: "https://x.com/tmertkarakas"
    - name: email
      title: "E-posta"
      url: "mailto:karakasdev@gmail.com"
    - name: rss
      title: "RSS"
      url: "index.xml"

  assets:
    disableHLJS: true
    # Modern tarayıcılar SVG'yi alır (temaya uyan), eskiler PNG'ye düşer
    favicon: "/favicon.svg"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]
