baseURL: "https://mertkarakasdev.github.io/"
title: "Tuğrul Mert Karakaş"
theme: "PaperMod"

locale: "tr"
defaultContentLanguage: "tr"
hasCJKLanguage: false

# Google Analytics (GA4) — sadece production derlemesinde yüklenir,
# yerel 'hugo server' önizlemesi istatistiklere karışmaz
services:
  googleAnalytics:
    ID: G-CM7707HGW2

enableRobotsTXT: true
enableEmoji: true
buildDrafts: false
buildFuture: false
buildExpired: false

# Sadece etiket kullanılıyor; categories kapalı (boş sayfa üretmesin)
taxonomies:
  tag: tags

pagination:
  pagerSize: 10

minify:
  disableXML: true

# PaperMod'un arama sayfası için JSON indeksi gerekir
outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: monokai

menu:
  main:
    - identifier: hakkimda
      name: "Hakkımda"
      url: /hakkimda/
      weight: 5
    - identifier: arsiv
      name: "Arşiv"
      url: /arsiv/
      weight: 10
    - identifier: etiketler
      name: "Etiketler"
      url: /tags/
      weight: 20
    - identifier: ara
      name: "Ara"
      url: /ara/
      weight: 30

params:
  # Navbar logosu — karakas.io marka işareti, currentColor ile temaya uyar
  label:
    text: "Tuğrul Mert Karakaş"
    iconSVG: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 125 125" fill="currentColor" aria-hidden="true"><path d="M44.7 6.92C47.36 4.452 45.613 0 41.983 0H3.993A3.994 3.994 0 0 0 0 3.994v35.26c0 3.487 4.155 5.3 6.71 2.928zM125 3.994A3.994 3.994 0 0 0 121.006 0h-14.658c-.999 0-1.961.374-2.697 1.048L38.478 60.732a3.994 3.994 0 0 0-.05 5.844l60.492 57.329a4 4 0 0 0 2.747 1.095h19.339a3.994 3.994 0 0 0 3.994-3.994zM6.755 82.058C4.215 79.626 0 81.426 0 84.943v36.063A3.994 3.994 0 0 0 3.994 125h37.671c3.6 0 5.362-4.389 2.762-6.878z"/></svg>'

  mainSections: ["posts"]  # ana sayfa sadece content/posts/ altındaki yazıları listeler
  author: "Tuğrul Mert Karakaş"
  description: "Tuğrul Mert Karakaş — full stack web geliştirici ve grafik tasarımcı. Yazılım ve tasarım üzerine notlar."
  keywords: ["blog", "yazılım", "notlar"]
  DateFormat: "2 January 2006"

  defaultTheme: auto       # auto | light | dark
  disableThemeToggle: false

  ShowReadingTime: true
  ShowWordCount: false
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowToc: true
  TocOpen: false
  hidemeta: false
  hideSummary: false
  comments: false

  # Ana sayfadaki karşılama bloğu
  homeInfoParams:
    Title: "Merhaba 👋"
    Content: >
      Full stack web geliştirici ve grafik tasarımcıyım. Burada öğrendiklerimi,
      üzerinde çalıştığım projeleri ve not almaya değer bulduğum şeyleri yazıyorum.

  # Footer'da logonun altındaki kısa tanım
  footer:
    text: "Full stack web geliştirici ve grafik tasarımcı."

  socialIcons:
    - name: github
      title: "GitHub"
      url: "https://github.com/mertkarakasdev"
    - name: x
      title: "X"
      url: "https://x.com/tmertkarakas"
    - name: linkedin
      title: "LinkedIn"
      url: "https://www.linkedin.com/in/mertkarakasdev/"
    - name: email
      title: "E-posta"
      url: "mailto:karakasdev@gmail.com"
    - name: rss
      title: "RSS"
      url: "/index.xml"

  assets:
    disableHLJS: true
    # Modern tarayıcılar SVG'yi alır (temaya uyan), eskiler PNG'ye düşer
    favicon: "/favicon.svg"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]
