{{- /* Navbar hava rozetinin stilleri */ -}}
{{- if site.Params.windy.apiKey }}
<style>
.windy-nav {
  display: none;                 /* veri gelene kadar gizli */
  align-items: center;
  gap: .25rem;
  margin-inline-start: .4rem;
  padding: .05rem .4rem;
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: .78rem;
  font-variant-numeric: tabular-nums;
  line-height: 1.6;
  color: var(--secondary);
  white-space: nowrap;
}
.windy-nav[data-hazir="1"] { display: inline-flex; }
.windy-nav svg { width: 12px; height: 12px; flex: none; }
.windy-nav-yer { max-width: 9ch; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 420px) { .windy-nav-yer { display: none; } }
</style>
{{- end }}
