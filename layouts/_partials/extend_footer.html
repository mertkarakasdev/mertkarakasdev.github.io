{{- /* Navbar hava rozeti — Windy Point Forecast API */ -}}
{{- with site.Params.windy }}
{{- if .apiKey }}
<script>
(function () {
  var AYAR = {
    key: {{ .apiKey }},
    lat: {{ .lat | default "41.0082" }},
    lon: {{ .lon | default "28.9784" }},
    yer: {{ .yer | default "İstanbul" }},
    model: {{ .model | default "gfs" }}
  };

  var rozet = document.querySelector('.windy-nav');
  if (!rozet) return;

  var dereceEl = rozet.querySelector('.windy-nav-derece');
  var yerEl    = rozet.querySelector('.windy-nav-yer');

  var ONBELLEK = 'windy-rozet';
  var SURE = 30 * 60 * 1000;   // 30 dk — API kotasını yakmamak için

  function oku() {
    try {
      var h = JSON.parse(localStorage.getItem(ONBELLEK) || 'null');
      return (h && (Date.now() - h.ts) < SURE) ? h : null;
    } catch (e) { return null; }
  }
  function yaz(v) {
    try { localStorage.setItem(ONBELLEK, JSON.stringify(v)); } catch (e) {}
  }

  function ciz(derece, yer) {
    dereceEl.textContent = derece + '°';
    yerEl.textContent = yer;
    rozet.dataset.hazir = '1';
  }

  function yuvarla(n) { return Math.round(n * 100) / 100; }

  function getir(lat, lon, yer) {
    fetch('https://api.windy.com/api/point-forecast/v2', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        lat: Number(lat), lon: Number(lon),
        model: AYAR.model,
        parameters: ['temp'],
        levels: ['surface'],
        key: AYAR.key
      })
    })
    .then(function (y) { if (!y.ok) throw new Error('HTTP ' + y.status); return y.json(); })
    .then(function (veri) {
      var seri = veri['temp-surface'];
      if (!seri || !seri.length) throw new Error('temp-surface yok');
      var derece = Math.round(seri[0] - 273.15);   // Kelvin -> Celsius
      ciz(derece, yer);
      yaz({ ts: Date.now(), derece: derece, yer: yer });
    })
    .catch(function () { /* sessizce gizli kal */ });
  }

  var onbellek = oku();
  if (onbellek) { ciz(onbellek.derece, onbellek.yer); return; }

  function varsayilan() { getir(AYAR.lat, AYAR.lon, AYAR.yer); }

  // İzin daha önce verilmişse sessizce konumu kullan; yoksa sorma, varsayılanı göster.
  if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: 'geolocation' }).then(function (izin) {
      if (izin.state === 'granted' && navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function (k) { getir(yuvarla(k.coords.latitude), yuvarla(k.coords.longitude), 'Konumun'); },
          varsayilan,
          { enableHighAccuracy: false, timeout: 8000, maximumAge: 1800000 }
        );
      } else { varsayilan(); }
    }).catch(varsayilan);
  } else { varsayilan(); }
})();
</script>
{{- end }}
{{- end }}
